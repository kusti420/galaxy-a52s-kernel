# WALT cpufreq governor + the phone's 5.4 post_boot governor tunables (drivers612/SPEC/08-walt-governor.md).
# Same format as drivers612/busdcvs/busdcvs.conf: <path under /sys> <value...>, applied in this order.
# Only sysfs: /proc/sys/walt cannot be written by vendor_init (label proc) nor by a52sxq_dsp_boot's kernfs
# table; those values are in a52sxq-walt.sh (root shell) and need a sched-walt default or a policy rule to ship.
# The governor line of each policy comes first: policyN/walt/ exists only after it.

# silver
devices/system/cpu/cpufreq/policy0/scaling_governor walt
devices/system/cpu/cpufreq/policy0/walt/down_rate_limit_us 0
devices/system/cpu/cpufreq/policy0/walt/up_rate_limit_us 0
devices/system/cpu/cpufreq/policy0/walt/hispeed_freq 1152000
devices/system/cpu/cpufreq/policy0/walt/pl 0
devices/system/cpu/cpufreq/policy0/walt/rtg_boost_freq 691200

# gold
devices/system/cpu/cpufreq/policy4/scaling_governor walt
devices/system/cpu/cpufreq/policy4/walt/down_rate_limit_us 0
devices/system/cpu/cpufreq/policy4/walt/up_rate_limit_us 0
devices/system/cpu/cpufreq/policy4/walt/hispeed_freq 1228800
devices/system/cpu/cpufreq/policy4/walt/hispeed_load 85
devices/system/cpu/cpufreq/policy4/walt/rtg_boost_freq 0
devices/system/cpu/cpufreq/policy4/walt/pl 0
devices/system/cpu/cpufreq/policy4/walt/boost -6

# gold+
devices/system/cpu/cpufreq/policy7/scaling_governor walt
devices/system/cpu/cpufreq/policy7/walt/down_rate_limit_us 0
devices/system/cpu/cpufreq/policy7/walt/up_rate_limit_us 0
devices/system/cpu/cpufreq/policy7/walt/hispeed_freq 1324800
devices/system/cpu/cpufreq/policy7/walt/hispeed_load 85
devices/system/cpu/cpufreq/policy7/walt/rtg_boost_freq 0
devices/system/cpu/cpufreq/policy7/walt/pl 0
devices/system/cpu/cpufreq/policy7/walt/boost -6
