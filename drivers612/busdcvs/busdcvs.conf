# Bus DCVS tunables for the 6.12 BSP on a52sxq (README.md). One write per line:
#   <path under /sys> <value...>
# Applied in this order by apply-busdcvs.sh (kexec test stage) and turned into init "write"
# lines of the real-boot vendor rc (build-realboot.sh; vendor rc writes run as vendor_init,
# which may write any sysfs file). Values = the ROM's 5.4 init.kernel.post_boot-yupik.sh for
# the same SoC and firmware, mapped onto the 6.12 bus_dcvs names (Qualcomm's 6.x post_boot
# writes the same attributes). DDR is LPDDR4X (ddr-type 7: the DDR table in bus_dcvs is the
# ddr4 one), so the ddr4 zones are used.

# --- bwmon LLCC (5.4 cpu-cpu-llcc-bw, bw_hwmon; polling_interval 40 -> window_ms)
devices/system/cpu/bus_dcvs/LLCC/90b6400.qcom,bwmon-llcc/window_ms 40
devices/system/cpu/bus_dcvs/LLCC/90b6400.qcom,bwmon-llcc/sample_ms 4
devices/system/cpu/bus_dcvs/LLCC/90b6400.qcom,bwmon-llcc/mbps_zones 2288 4577 7110 9155 12298 14236 15258
devices/system/cpu/bus_dcvs/LLCC/90b6400.qcom,bwmon-llcc/io_percent 68
devices/system/cpu/bus_dcvs/LLCC/90b6400.qcom,bwmon-llcc/hist_memory 20
devices/system/cpu/bus_dcvs/LLCC/90b6400.qcom,bwmon-llcc/hyst_length 0
devices/system/cpu/bus_dcvs/LLCC/90b6400.qcom,bwmon-llcc/down_thres 80
devices/system/cpu/bus_dcvs/LLCC/90b6400.qcom,bwmon-llcc/guard_band_mbps 0
devices/system/cpu/bus_dcvs/LLCC/90b6400.qcom,bwmon-llcc/up_scale 250
devices/system/cpu/bus_dcvs/LLCC/90b6400.qcom,bwmon-llcc/idle_mbps 1600

# --- bwmon DDR (5.4 cpu-llcc-ddr-bw; polling_interval 48)
devices/system/cpu/bus_dcvs/DDR/9091000.qcom,bwmon-ddr/window_ms 48
devices/system/cpu/bus_dcvs/DDR/9091000.qcom,bwmon-ddr/sample_ms 4
devices/system/cpu/bus_dcvs/DDR/9091000.qcom,bwmon-ddr/mbps_zones 1144 1720 2086 2929 3879 5931 6515 8136
devices/system/cpu/bus_dcvs/DDR/9091000.qcom,bwmon-ddr/io_percent 68
devices/system/cpu/bus_dcvs/DDR/9091000.qcom,bwmon-ddr/hist_memory 20
devices/system/cpu/bus_dcvs/DDR/9091000.qcom,bwmon-ddr/hyst_length 0
devices/system/cpu/bus_dcvs/DDR/9091000.qcom,bwmon-ddr/down_thres 80
devices/system/cpu/bus_dcvs/DDR/9091000.qcom,bwmon-ddr/guard_band_mbps 0
devices/system/cpu/bus_dcvs/DDR/9091000.qcom,bwmon-ddr/up_scale 250
devices/system/cpu/bus_dcvs/DDR/9091000.qcom,bwmon-ddr/idle_mbps 1600

# --- bwmon L3 (5.4 snoop-l3-bw; max_freq 9155 MB/s at 32 B = 286 MHz -> the lowest L3 level:
# on 5.4 the snoop monitor never raised L3 above its floor, L3 came from the latency governor)
devices/system/cpu/bus_dcvs/L3/90b9100.qcom,bwmon-l3/window_ms 40
devices/system/cpu/bus_dcvs/L3/90b9100.qcom,bwmon-l3/sample_ms 4
devices/system/cpu/bus_dcvs/L3/90b9100.qcom,bwmon-l3/io_percent 10
devices/system/cpu/bus_dcvs/L3/90b9100.qcom,bwmon-l3/hist_memory 20
devices/system/cpu/bus_dcvs/L3/90b9100.qcom,bwmon-l3/hyst_length 10
devices/system/cpu/bus_dcvs/L3/90b9100.qcom,bwmon-l3/down_thres 0
devices/system/cpu/bus_dcvs/L3/90b9100.qcom,bwmon-l3/guard_band_mbps 0
devices/system/cpu/bus_dcvs/L3/90b9100.qcom,bwmon-l3/up_scale 0
devices/system/cpu/bus_dcvs/L3/90b9100.qcom,bwmon-l3/idle_mbps 1600
devices/system/cpu/bus_dcvs/L3/90b9100.qcom,bwmon-l3/max_freq 300000

# --- memlat (AP mode). DDR/LLCC: driver defaults = 5.4 (ipm_ceil 400 = ratio_ceil 400, sample
# 8 ms = polling_interval 8). L3: the 5.4 RIMPS L3 ratio_ceil per cluster (400/4000/20000) and
# l2wb 60 % / filter 25000. DDRQOS: 5.4 qoslat ratio_ceil 50.
devices/system/cpu/bus_dcvs/memlat_settings/sample_ms 8
devices/system/cpu/bus_dcvs/L3/soc:qcom,memlat:l3:silver/ipm_ceil 400
devices/system/cpu/bus_dcvs/L3/soc:qcom,memlat:l3:gold/ipm_ceil 4000
devices/system/cpu/bus_dcvs/L3/soc:qcom,memlat:l3:gold/wb_pct_thres 60
devices/system/cpu/bus_dcvs/L3/soc:qcom,memlat:l3:gold/wb_filter_ipm 25000
devices/system/cpu/bus_dcvs/L3/soc:qcom,memlat:l3:prime/ipm_ceil 20000
devices/system/cpu/bus_dcvs/L3/soc:qcom,memlat:l3:prime/wb_pct_thres 60
devices/system/cpu/bus_dcvs/L3/soc:qcom,memlat:l3:prime/wb_filter_ipm 25000
devices/system/cpu/bus_dcvs/DDRQOS/soc:qcom,memlat:ddrqos:gold/ipm_ceil 50
devices/system/cpu/bus_dcvs/DDRQOS/soc:qcom,memlat:ddrqos:prime/ipm_ceil 50

# --- end of the boot boost. qcom-dcvs starts every slow path with boost_freq = hw_max_freq
# ("better boot perf", dcvs.c) and only userspace lowers it (Qualcomm's post_boot:
# cat hw_min_freq > boost_freq). The store clamps 0 up to hw_min_freq.
devices/system/cpu/bus_dcvs/DDR/boost_freq 0
devices/system/cpu/bus_dcvs/LLCC/boost_freq 0
devices/system/cpu/bus_dcvs/L3/boost_freq 0
devices/system/cpu/bus_dcvs/DDRQOS/boost_freq 0

# --- interconnect sync_state. Until EVERY qnoc-yupik provider got sync_state, icc core keeps
# the keepalive BCMs' initial vote INT_MAX (MC0 = DDR/ebi, SH0 = LLCC, ...): DDR and LLCC at
# max whatever DCVS votes. sync_state never comes on 6.12 here, because consumers with no
# driver hold it (run ab-s76: 8804000.sdhci (no SD driver on purpose), 1e00000.qcom,ipa (MODEM=0),
# a80000.i2c (SE8, SM5714 USB-PD: pins 32/33 are in boarddt's qcom,gpios-reserved)). Writing 1
# to state_synced runs the provider's sync_state once (already synced ones answer -EINVAL).
devices/platform/soc/soc:interconnect/state_synced 1
devices/platform/soc/1500000.interconnect/state_synced 1
devices/platform/soc/1502000.interconnect/state_synced 1
devices/platform/soc/1580000.interconnect/state_synced 1
devices/platform/soc/1680000.interconnect/state_synced 1
devices/platform/soc/16e0000.interconnect/state_synced 1
devices/platform/soc/1700000.interconnect/state_synced 1
devices/platform/soc/1740000.interconnect/state_synced 1
devices/platform/soc/3c40000.interconnect/state_synced 1
devices/platform/soc/90e0000.interconnect/state_synced 1
devices/platform/soc/9100000.interconnect/state_synced 1
devices/platform/soc/a0c0000.interconnect/state_synced 1
